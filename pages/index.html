<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./img/LOGO.png" />
    <meta name="theme-color" content="#67AAE6" />
    <link rel="stylesheet" href="./styles/estilos.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Cabin:wght@400..700&family=Montserrat:wght@100..900&display=swap" rel="stylesheet" />

    <title>Undergrade Distance - PWA</title>

    <style>
        /* Estilos rápidos para los nuevos módulos */
        .herramientas-pwa { padding: 20px; background: #f4f4f4; text-align: center; border-radius: 10px; margin: 20px; }
        .video-container video { width: 100%; max-width: 400px; border-radius: 10px; border: 2px solid #67AAE6; }
        .calc-box { display: inline-block; padding: 15px; background: #333; border-radius: 10px; color: white; margin-top: 15px; }
        .calc-box input { width: 60px; padding: 5px; text-align: center; }
        .btn-pwa { background: #67AAE6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin: 5px; }
    </style>
</head>

<body>
    <header class="header-principal">
        <nav class="menu-primario">
            <ul><li>Undergrade Distance</li></ul>
        </nav>
        <div class="enter-container">
            <div class="icons">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>
    </header>

    <div class="logo">
        <img src="./img/LOGO.png" alt="logo Pagina" />
    </div>

    <section class="herramientas-pwa">
        <h3>Herramientas del Dispositivo</h3>
        
        <div class="video-container">
            <video id="player" autoplay playsinline></video><br>
            <button class="btn-pwa" id="btn-camara">Abrir Cámara</button>
            <button class="btn-pwa" id="btn-foto" style="display:none;">Tomar Foto</button>
            <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
        </div>

        <div class="calc-box">
            <h4>Calculadora Rápida</h4>
            <input type="number" id="val1" placeholder="0">
            <span>+</span>
            <input type="number" id="val2" placeholder="0">
            <button class="btn-pwa" onclick="calcularSuma()">=</button>
            <span id="res-calc">?</span>
        </div>
    </section>

    <section class="login-section">
        <div class="banner">
            <img src="./img/FONDOPRINCIPAL.jpeg" alt="Banner Principal" />
            <div class="banner-text"><h2>Aulas virtuales Uniminuto</h2></div>
        </div>

        <section class="login">
            <h3>INICIO DE SESION</h3>
            <form>
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Usuario" required />
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Contraseña" required />
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
        </section>
    </section>

    <div id="accessibility-btn"><span>🧍</span></div>
    <div id="accessibility-menu">
        <h4>Accesibilidad</h4>
        <button id="zoom-in">Aumentar</button>
        <button id="zoom-out">Reducir</button>
        <button id="toggle-contrast">Contraste</button>
        <button id="reset">Reset</button>
    </div>

    <script src="./js/main.js"></script>
    <script src="./js/accesibilidad.js"></script>

    <script>
        // Lógica de la Cámara
        const player = document.getElementById('player');
        const btnCamara = document.getElementById('btn-camara');
        const btnFoto = document.getElementById('btn-foto');
        const canvas = document.getElementById('canvas');

        btnCamara.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                player.srcObject = stream;
                btnCamara.style.display = 'none';
                btnFoto.style.display = 'inline-block';
            } catch (err) {
                alert("Error al acceder a la cámara: " + err);
            }
        });

        btnFoto.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            context.drawImage(player, 0, 0, canvas.width, canvas.height);
            alert("¡Foto capturada en el canvas!");
        });

        // Lógica de Calculadora
        function calcularSuma() {
            const n1 = parseFloat(document.getElementById('val1').value) || 0;
            const n2 = parseFloat(document.getElementById('val2').value) || 0;
            document.getElementById('res-calc').innerText = n1 + n2;
        }

        // Service Worker corregido para GitHub Pages
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                .then(reg => console.log("SW registrado en:", reg.scope))
                .catch(err => console.error("Fallo al registrar SW:", err));
            });
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</body>
</html>
